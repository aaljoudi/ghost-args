name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax checks
        run: |
          sh -n install.sh
          zsh -n script-arg-hints.zsh
          zsh -n tests/run-tests.zsh
      - name: Hint tests
        run: zsh tests/run-tests.zsh
      - name: Installation tests
        run: sh tests/install-tests.sh
      - name: Interactive terminal test
        run: python3 tests/interactive-tests.py
      - name: Check out autosuggestions for compatibility tests
        uses: actions/checkout@v4
        with:
          repository: zsh-users/zsh-autosuggestions
          ref: v0.7.1
          path: .test-deps/zsh-autosuggestions
          persist-credentials: false
      - name: Test automatic hints alongside autosuggestions
        run: |
          python3 tests/interactive-tests.py --autosuggestions .test-deps/zsh-autosuggestions/zsh-autosuggestions.zsh
          python3 tests/interactive-tests.py --autosuggestions .test-deps/zsh-autosuggestions/zsh-autosuggestions.zsh --plugin-first
